<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #94a3b8; }
    .badge { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
    .card-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
    .card-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .metric-val { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 800; fill: #f8fafc; }
    .metric-lbl { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; }
    .tag { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f59e0b; }
  </style>
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <g opacity="0.06" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="180" x2="1600" y2="180"/><line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="0" y1="540" x2="1600" y2="540"/><line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="900"/><line x1="640" y1="0" x2="640" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/><line x1="1280" y1="0" x2="1280" y2="900"/>
  </g>
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#f59e0b" fill-opacity="0.25"/>
    <text x="12" y="17" class="badge" fill="#f59e0b">Pessoas, equipes e delegação</text>
    <text x="0" y="65" class="title">/teamcapacity · Capacidade da equipe</text>
    <text x="0" y="95" class="subtitle">Compara demanda, disponibilidade, competências e carga de trabalho.</text>
    <g transform="translate(1080, 10)">
      <rect x="0" y="0" width="360" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" class="metric-lbl">EXEMPLO DE APLICAÇÃO</text>
      <text x="16" y="48" font-family="sans-serif" font-size="12" font-weight="600" fill="#f59e0b">Avalie se a equipe tem capacidade para absorv...</text>
    </g>
  </g>

  <g transform="translate(80, 220)">
    <!-- Top 4 KPIs -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="345" height="130" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="38" class="metric-lbl">VOLUME TOTAL PROCESSADO</text>
      <text x="24" y="78" class="metric-val" font-size="30" fill="#38bdf8">14.850</text>
      <text x="24" y="106" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">▲ +12.4% vs mês anterior</text>

      <rect x="365" y="0" width="345" height="130" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="389" y="38" class="metric-lbl">EFICIÊNCIA OPERACIONAL</text>
      <text x="389" y="78" class="metric-val" font-size="30" fill="#f59e0b">96.2%</text>
      <text x="389" y="106" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">▲ Meta atingida</text>

      <rect x="730" y="0" width="345" height="130" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="754" y="38" class="metric-lbl">CUSTO UNITÁRIO MÉDIO</text>
      <text x="754" y="78" class="metric-val" font-size="30" fill="#f8fafc">R$ 48,20</text>
      <text x="754" y="106" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">▼ -8.5% economia</text>

      <rect x="1095" y="0" width="345" height="130" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="1119" y="38" class="metric-lbl">NÍVEL DE SERVIÇO (SLA)</text>
      <text x="1119" y="78" class="metric-val" font-size="30" fill="#34d399">99.1%</text>
      <text x="1119" y="106" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Excelência operacional</text>
    </g>

    <!-- Main Chart & Breakdown Section -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="940" height="430" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="32" y="44" class="card-title">Evolução Mensal &amp; Tendência de Produtividade</text>
      <!-- Bars Chart -->
      <g transform="translate(40, 90)">
        <line x1="0" y1="260" x2="840" y2="260" stroke="#334155" stroke-width="1.5"/>
        <line x1="0" y1="180" x2="840" y2="180" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
        <line x1="0" y1="100" x2="840" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
        <!-- Month Bars -->
        <rect x="60" y="120" width="50" height="140" rx="6" fill="#f59e0b"/>
        <rect x="180" y="90" width="50" height="170" rx="6" fill="#f59e0b"/>
        <rect x="300" y="60" width="50" height="200" rx="6" fill="#f59e0b"/>
        <rect x="420" y="80" width="50" height="180" rx="6" fill="#f59e0b"/>
        <rect x="540" y="40" width="50" height="220" rx="6" fill="#ef4444"/>
        <rect x="660" y="20" width="50" height="240" rx="6" fill="#34d399"/>
        <!-- Line Chart Overlay -->
        <path d="M85 110 L205 80 L325 50 L445 70 L565 30 L685 10" fill="none" stroke="#f8fafc" stroke-width="3"/>
        <circle cx="85" cy="110" r="5" fill="#f8fafc"/>
        <circle cx="205" cy="80" r="5" fill="#f8fafc"/>
        <circle cx="325" cy="50" r="5" fill="#f8fafc"/>
        <circle cx="445" cy="70" r="5" fill="#f8fafc"/>
        <circle cx="565" cy="30" r="5" fill="#ef4444"/>
        <circle cx="685" cy="10" r="6" fill="#34d399" filter="url(#glow)"/>
        <!-- Labels -->
        <text x="65" y="290" class="metric-lbl">JAN</text>
        <text x="185" y="290" class="metric-lbl">FEV</text>
        <text x="305" y="290" class="metric-lbl">MAR</text>
        <text x="425" y="290" class="metric-lbl">ABR</text>
        <text x="545" y="290" class="metric-lbl">MAI</text>
        <text x="665" y="290" class="metric-lbl">JUN</text>
      </g>

      <!-- Side Breakdown Panel -->
      <g transform="translate(970, 0)">
        <rect x="0" y="0" width="470" height="430" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
        <text x="28" y="44" class="card-title">Direcionadores Críticos</text>
        
        <g transform="translate(28, 70)">
          <rect x="0" y="0" width="414" height="65" rx="10" fill="#0f172a" stroke="#1e293b"/>
          <text x="16" y="28" class="card-title" font-size="14">Capacidade Disponível</text>
          <text x="16" y="50" class="card-desc">88% alocada em alta performance</text>
          <text x="330" y="40" font-family="sans-serif" font-size="18" font-weight="800" fill="#38bdf8">88%</text>
        </g>

        <g transform="translate(28, 150)">
          <rect x="0" y="0" width="414" height="65" rx="10" fill="#0f172a" stroke="#1e293b"/>
          <text x="16" y="28" class="card-title" font-size="14">Ociosidade &amp; Espera</text>
          <text x="16" y="50" class="card-desc">Redução progressiva de gargalos</text>
          <text x="340" y="40" font-family="sans-serif" font-size="18" font-weight="800" fill="#34d399">4.2%</text>
        </g>

        <g transform="translate(28, 230)">
          <rect x="0" y="0" width="414" height="65" rx="10" fill="#0f172a" stroke="#1e293b"/>
          <text x="16" y="28" class="card-title" font-size="14">Retorno sobre Esforço (ROI)</text>
          <text x="16" y="50" class="card-desc">Multiplicador de valor operacional</text>
          <text x="345" y="40" font-family="sans-serif" font-size="18" font-weight="800" fill="#f59e0b">3.8x</text>
        </g>

        <rect x="28" y="320" width="414" height="85" rx="12" fill="#0369a1" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
        <text x="44" y="352" font-family="sans-serif" font-size="13" font-weight="700" fill="#f59e0b">RECOMENDAÇÃO DA GESTÃO</text>
        <text x="44" y="380" font-family="sans-serif" font-size="12" fill="#cbd5e1">Manter ritmo de automação e rebalancear equipes com sobrecarga.</text>
      </g>
    </g>
  </g>
</svg>