<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #94a3b8; }
    .badge { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
    .card-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
    .card-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .metric-val { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 800; fill: #f8fafc; }
    .metric-lbl { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; }
    .tag { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #ec4899; }
  </style>
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <g opacity="0.06" stroke="#ec4899" stroke-width="1">
    <line x1="0" y1="180" x2="1600" y2="180"/><line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="0" y1="540" x2="1600" y2="540"/><line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="900"/><line x1="640" y1="0" x2="640" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/><line x1="1280" y1="0" x2="1280" y2="900"/>
  </g>
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#ec4899" fill-opacity="0.25"/>
    <text x="12" y="17" class="badge" fill="#ec4899">Decisão e priorização</text>
    <text x="0" y="65" class="title">/scenarioplanning · Planejamento de cenários</text>
    <text x="0" y="95" class="subtitle">Prepara respostas para futuros possíveis e incertezas relevantes.</text>
    <g transform="translate(1080, 10)">
      <rect x="0" y="0" width="360" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" class="metric-lbl">EXEMPLO DE APLICAÇÃO</text>
      <text x="16" y="48" font-family="sans-serif" font-size="12" font-weight="600" fill="#ec4899">Avalie como mudanças de volume afetariam a ca...</text>
    </g>
  </g>

  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="1440" height="600" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <line x1="720" y1="40" x2="720" y2="560" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="40" y1="300" x2="1400" y2="300" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Quadrant 1: Top Left -->
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="620" height="230" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="20" y="20" width="110" height="24" rx="6" fill="#ec4899" fill-opacity="0.2"/>
      <text x="30" y="36" class="tag">ALTO IMPACTO</text>
      <text x="20" y="80" class="card-title">Prioridade Imediata (Quick Wins)</text>
      <text x="20" y="115" class="card-desc">• Ações de execução rápida com alto retorno operacional.</text>
      <text x="20" y="145" class="card-desc">• Menor esforço relativo e aprovação simplificada.</text>
      <rect x="20" y="175" width="220" height="34" rx="8" fill="#1e293b"/>
      <text x="32" y="197" class="metric-lbl">STATUS: <tspan fill="#34d399" font-weight="700">EM EXECUÇÃO</tspan></text>
    </g>

    <!-- Quadrant 2: Top Right -->
    <g transform="translate(760, 40)">
      <rect x="0" y="0" width="620" height="230" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.7"/>
      <rect x="20" y="20" width="130" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="30" y="36" class="tag" fill="#8b5cf6">PROJETO ESTRATÉGICO</text>
      <text x="20" y="80" class="card-title">Transformação &amp; Inovação</text>
      <text x="20" y="115" class="card-desc">• Requer planejamento detalhado, governança e investimento.</text>
      <text x="20" y="145" class="card-desc">• Alto impacto a médio/longo prazo na escalabilidade.</text>
      <rect x="20" y="175" width="220" height="34" rx="8" fill="#1e293b"/>
      <text x="32" y="197" class="metric-lbl">HORIZONTE: <tspan fill="#8b5cf6" font-weight="700">Q3 - Q4</tspan></text>
    </g>

    <!-- Quadrant 3: Bottom Left -->
    <g transform="translate(60, 330)">
      <rect x="0" y="0" width="620" height="230" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="20" y="20" width="120" height="24" rx="6" fill="#475569" fill-opacity="0.3"/>
      <text x="30" y="36" class="tag" fill="#94a3b8">BAIXO ESFORÇO</text>
      <text x="20" y="80" class="card-title">Tarefas de Suporte &amp; Rotina</text>
      <text x="20" y="115" class="card-desc">• Demandas operacionais pontuais para delegar ou automatizar.</text>
      <text x="20" y="145" class="card-desc">• Manter em monitoramento contínuo sem alocar gestores.</text>
      <rect x="20" y="175" width="220" height="34" rx="8" fill="#1e293b"/>
      <text x="32" y="197" class="metric-lbl">DELEGAÇÃO: <tspan fill="#38bdf8" font-weight="700">NÍVEL 1 E 2</tspan></text>
    </g>

    <!-- Quadrant 4: Bottom Right -->
    <g transform="translate(760, 330)">
      <rect x="0" y="0" width="620" height="230" rx="14" fill="#0f172a" stroke="#dc2626" stroke-width="1" stroke-opacity="0.4"/>
      <rect x="20" y="20" width="120" height="24" rx="6" fill="#dc2626" fill-opacity="0.2"/>
      <text x="30" y="36" class="tag" fill="#f87171">ALTO ESFORÇO</text>
      <text x="20" y="80" class="card-title">Eliminar ou Postergar</text>
      <text x="20" y="115" class="card-desc">• Tarefas que consomem tempo sem gerar retorno palpável.</text>
      <text x="20" y="145" class="card-desc">• Descartar iniciativas redundantes e mitigar riscos críticos.</text>
      <rect x="20" y="175" width="220" height="34" rx="8" fill="#1e293b"/>
      <text x="32" y="197" class="metric-lbl">DECISÃO: <tspan fill="#f87171" font-weight="700">DESPRIORIZAR</tspan></text>
    </g>
  </g>
</svg>