<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 500; fill: #94a3b8; }
    .badge { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
    .card-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
    .card-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .metric-val { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 800; fill: #f8fafc; }
    .metric-lbl { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; }
    .tag { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f59e0b; }
  </style>
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <g opacity="0.06" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="180" x2="1600" y2="180"/><line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="0" y1="540" x2="1600" y2="540"/><line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="900"/><line x1="640" y1="0" x2="640" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/><line x1="1280" y1="0" x2="1280" y2="900"/>
  </g>
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#f59e0b" fill-opacity="0.25"/>
    <text x="12" y="17" class="badge" fill="#f59e0b">Pessoas, equipes e delegação</text>
    <text x="0" y="65" class="title">/delegationmap · Mapa de delegação</text>
    <text x="0" y="95" class="subtitle">Define tarefas, responsáveis, níveis de autonomia e pontos de acompanhamento.</text>
    <g transform="translate(1080, 10)">
      <rect x="0" y="0" width="360" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" class="metric-lbl">EXEMPLO DE APLICAÇÃO</text>
      <text x="16" y="48" font-family="sans-serif" font-size="12" font-weight="600" fill="#f59e0b">Mapeie o que pode ser delegado e quais decisõ...</text>
    </g>
  </g>

  <g transform="translate(80, 220)">
    <!-- 4 Flow Horizontal Stages -->
    <g transform="translate(0, 0)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="20" y="20" width="70" height="24" rx="6" fill="#f59e0b" fill-opacity="0.25"/>
      <text x="32" y="36" class="step-num" fill="#f59e0b">PASSO 1</text>
      <circle cx="310" cy="32" r="6" fill="#f59e0b"/>
      <text x="20" y="85" class="card-title">Mapeamento Inicial</text>
      <text x="20" y="115" class="card-desc">• Identificar responsabilidades,</text>
      <text x="20" y="135" class="card-desc">  entradas de dados e interface</text>
      <text x="20" y="155" class="card-desc">  entre as equipes envolvidas.</text>
      <rect x="20" y="200" width="305" height="150" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="36" y="235" class="metric-lbl">RESPONSÁVEL</text>
      <text x="36" y="260" class="metric-val" font-size="15" fill="#f8fafc">Liderança / Gestão</text>
      <text x="36" y="300" class="metric-lbl">ENTREGA</text>
      <text x="36" y="325" font-family="sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Diagnóstico Concluído</text>

      <!-- Stage 2 -->
      <rect x="365" y="0" width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="385" y="20" width="70" height="24" rx="6" fill="#ef4444" fill-opacity="0.25"/>
      <text x="397" y="36" class="step-num" fill="#ef4444">PASSO 2</text>
      <circle cx="675" cy="32" r="6" fill="#ef4444"/>
      <text x="385" y="85" class="card-title">Alinhamento &amp; Pauta</text>
      <text x="385" y="115" class="card-desc">• Definir critérios de decisão,</text>
      <text x="385" y="135" class="card-desc">  níveis de autonomia acordados</text>
      <text x="385" y="155" class="card-desc">  e papéis transparentes.</text>
      <rect x="385" y="200" width="305" height="150" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="401" y="235" class="metric-lbl">CADÊNCIA</text>
      <text x="401" y="260" class="metric-val" font-size="15" fill="#f8fafc">Semanal / Recorrente</text>
      <text x="401" y="300" class="metric-lbl">OBJETIVO</text>
      <text x="401" y="325" font-family="sans-serif" font-size="13" font-weight="700" fill="#ef4444">Clareza de Papéis</text>

      <!-- Stage 3 -->
      <rect x="730" y="0" width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="750" y="20" width="70" height="24" rx="6" fill="#10b981" fill-opacity="0.25"/>
      <text x="762" y="36" class="step-num" fill="#34d399">PASSO 3</text>
      <circle cx="1040" cy="32" r="6" fill="#34d399"/>
      <text x="750" y="85" class="card-title">Execução &amp; Acompanhamento</text>
      <text x="750" y="115" class="card-desc">• Ação prática orientada a dados,</text>
      <text x="750" y="135" class="card-desc">  eliminando retrabalho e</text>
      <text x="750" y="155" class="card-desc">  otimizando capacidade do time.</text>
      <rect x="750" y="200" width="305" height="150" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="766" y="235" class="metric-lbl">PROGRESSO</text>
      <text x="766" y="260" class="metric-val" font-size="15" fill="#34d399">100% dos Prazos</text>
      <text x="766" y="300" class="metric-lbl">MONITORAMENTO</text>
      <text x="766" y="325" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">Rotina Ágil</text>

      <!-- Stage 4 -->
      <rect x="1095" y="0" width="345" height="380" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="1115" y="20" width="70" height="24" rx="6" fill="#f59e0b" fill-opacity="0.3"/>
      <text x="1127" y="36" class="step-num" fill="#f59e0b">PASSO 4</text>
      <circle cx="1405" cy="32" r="6" fill="#f59e0b" filter="url(#glow)"/>
      <text x="1115" y="85" class="card-title">Validação &amp; Acordos</text>
      <text x="1115" y="115" class="card-desc">• Revisão de resultados finais,</text>
      <text x="1115" y="135" class="card-desc">  aprendizado contínuo e</text>
      <text x="1115" y="155" class="card-desc">  documentação das decisões.</text>
      <rect x="1115" y="200" width="305" height="150" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="1131" y="235" class="metric-lbl">RESULTADO FINAL</text>
      <text x="1131" y="260" class="metric-val" font-size="15" fill="#f59e0b">Eficiência Validada</text>
      <text x="1131" y="300" class="metric-lbl">STATUS</text>
      <text x="1131" y="325" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Concluído com Sucesso</text>
    </g>

    <!-- Bottom Governance Bar -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="1440" height="180" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="28" y="36" class="badge" fill="#64748b">DIRETRIZES OPERACIONAIS E PONTOS DE CONTROLE</text>
      <g transform="translate(28, 55)">
        <g transform="translate(0, 0)">
          <circle cx="8" cy="18" r="4" fill="#f59e0b"/>
          <text x="22" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Foco em Resultados:</text>
          <text x="22" y="44" font-family="sans-serif" font-size="13" fill="#94a3b8">Orientar cada decisão para redução de atrito e ganho palpável de produtividade.</text>
        </g>
        <g transform="translate(480, 0)">
          <circle cx="8" cy="18" r="4" fill="#ef4444"/>
          <text x="22" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Comunicação Transparente:</text>
          <text x="22" y="44" font-family="sans-serif" font-size="13" fill="#94a3b8">Registrar impedimentos e alinhar expectativas entre líderes e liderados.</text>
        </g>
        <g transform="translate(960, 0)">
          <circle cx="8" cy="18" r="4" fill="#34d399"/>
          <text x="22" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Melhoria Contínua:</text>
          <text x="22" y="44" font-family="sans-serif" font-size="13" fill="#94a3b8">Avaliar ciclos quinzenalmente para calibrar processos e celebrar marcos.</text>
        </g>
      </g>
    </g>
  </g>
</svg>